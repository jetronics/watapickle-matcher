name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Allow camera
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>|' $M
          grep -n CAMERA $M
      - run: pip install pillow
      - name: Make app icon
        run: python make_icons.py
      - name: Set app name
        run: |
          F=android/app/src/main/res/values/strings.xml
          sed -i 's|name="app_name">[^<]*<|name="app_name">WataPickle Matcher<|; s|name="title_activity_main">[^<]*<|name="title_activity_main">WataPickle Matcher<|' $F
          grep -E "app_name|title_activity" $F
          ls android/app/src/main/res/mipmap-xxxhdpi
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WataPickle-Matcher-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
